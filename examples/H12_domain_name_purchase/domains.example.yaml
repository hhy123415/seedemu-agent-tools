# 三合一初始化示例，服务及节点引用对应当前 H12。
# 客户密码直接在 clients 中配置。

hosting-nameservers:
  ns1.example.com: hosted-dns-primary
  ns2.example.com: hosted-dns-secondary

contacts:
  contact-alice:
    name: Alice
    email: alice@example.com
    phone: "+86.13800138000"
    address:
      street: ["123 Example Road"]
      city: Shanghai
      province: Shanghai
      postal_code: "200000"
      country_code: CN

  contact-bob:
    name: Bob
    email: bob@example.net
    phone: "+86.13900139000"
    address:
      street: ["456 Example Road"]
      city: Beijing
      province: Beijing
      postal_code: "100000"
      country_code: CN

clients:
  client-alice:
    email: alice@example.com
    password: seedalice
    contact: contact-alice

  client-bob:
    email: bob@example.net
    password: seedbob
    contact: contact-bob

domains:
  - name: alice.com
    registrant: contact-alice
    nameservers:
      - ns1.example.com
      - ns2.example.com

    registration:
      registry: registry
      created_at: "2026-10-28T00:00:00Z"
      expires_at: "2027-10-28T00:00:00Z"
      statuses: [ok]

    registrar:
      server: fossbilling
      client: client-alice
      status: active
      auto_renew: false

    dns:
      ttl: 300
      soa:
        rname: hostmaster.alice.com.
        serial: 2026102801
        refresh: 900
        retry: 900
        expire: 1800
        minimum: 60
      records:
        - name: www
          type: A
          value: "192.0.2.80"
        - name: mail
          type: A
          value: "192.0.2.81"
        - name: "@"
          type: MX
          value: "10 mail.alice.com."
        - name: "@"
          type: TXT
          value: '"v=spf1 mx -all"'

  - name: bob.net
    registrant: contact-bob
    nameservers:
      - ns1.example.com
      - ns2.example.com

    registration:
      registry: registry
      created_at: "2026-10-29T00:00:00Z"
      expires_at: "2027-10-29T00:00:00Z"
      statuses: [ok]

    registrar:
      server: fossbilling
      client: client-bob
      status: active
      auto_renew: true

    dns:
      ttl: 600
      soa:
        rname: hostmaster.bob.net.
        serial: 2026102901
        refresh: 900
        retry: 900
        expire: 1800
        minimum: 60
      records:
        - name: "@"
          type: A
          value: "192.0.2.90"
        - name: www
          type: CNAME
          value: "bob.net."
        - name: "@"
          type: TXT
          ttl: 300
          value: '"example verification text"'
