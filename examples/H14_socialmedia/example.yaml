id: h14-socialmedia
name: H14 Mastodon with DNS and CA-issued HTTPS
description: Runtime validation for DNS, CA trust, Mastodon processes and public APIs.
runner: internet
script: socialmedia.py
platform: amd
features:
  - socialmedia
  - dns
  - pki

compile:
  enabled: true
  output: output
  clean:
    - output
  expected:
    - output/docker-compose.yml
  timeout: 300

build:
  enabled: true
  timeout: 7200

runtime:
  compose: output/docker-compose.yml
  readiness:
    - name: H14 service and client containers are running
      type: compose-ps
      services:
        - hnode_151_dns
        - hnode_151_dns-secondary
        - hnode_151_local-dns
        - hnode_151_ca
        - hnode_151_mastodon
        - hnode_151_alice
        - hnode_151_bob
      retries: 30
      interval: 2
    - name: Mastodon HTTPS initialization completed
      type: exec
      service: hnode_151_mastodon
      command: curl --connect-timeout 3 --max-time 10 -fsS https://mastodon.com:18443/api/v2/instance >/dev/null
      retries: 120
      interval: 5

test_programs:
  - name: H14 custom runtime validation
    script: test_runtime.py
    timeout: 3600
