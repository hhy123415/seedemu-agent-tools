[unix_http_server]
file=/run/mastodon-supervisor.sock
chmod=0700
[supervisord]
logfile=/var/log/mastodon-supervisor.log
pidfile=/run/mastodon-supervisor.pid
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/mastodon-supervisor.sock
[program:web]
command=/opt/mastodon-service/run.sh bundle exec puma -C config/puma.rb
user=mastodon
autorestart=true
stdout_logfile=/var/log/mastodon-web.log
redirect_stderr=true
[program:worker]
command=/opt/mastodon-service/run.sh bundle exec sidekiq -c 5
user=mastodon
autorestart=true
stdout_logfile=/var/log/mastodon-worker.log
redirect_stderr=true
[program:streaming]
command=/opt/mastodon-service/run.sh node streaming/index.js
user=mastodon
environment=PORT="4000",NODE_EXTRA_CA_CERTS="/etc/ssl/certs/ca-certificates.crt"
autorestart=true
stdout_logfile=/var/log/mastodon-streaming.log
redirect_stderr=true
