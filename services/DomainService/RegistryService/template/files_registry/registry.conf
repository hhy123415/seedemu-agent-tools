# 在 8080 端口提供面板，并将 PHP 请求转交 PHP-FPM。 / Serve the panel on port 8080 and forward PHP requests to PHP-FPM.
server {
    listen 8080;
    server_name _;
    root /opt/registry/cp/public;
    index index.php;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
    # Namingo 使用 /registry/tld/.com 这类路径管理 TLD。
    # Namingo manages TLDs through paths such as /registry/tld/.com.
    # 此路由必须位于禁止访问隐藏文件的规则之前。
    # This route must precede the rule that denies access to hidden files.
    location ~ ^/registry/tld/\.[a-z0-9-]+$ {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ /\. { deny all; }
}
